<!DOCTYPE html>
<html>
<head>
<title>Shelby Media Gallery</title>

<style>

body{
font-family:Arial;
background:#ff69b4;
color:white;
margin:0;
padding:20px;
}

.header{
text-align:center;
margin-bottom:30px;
}

.logo{
width:120px;
margin-bottom:10px;
}

h1{
margin:10px 0;
}

.search-box{
text-align:center;
margin-bottom:30px;
}

input{
width:300px;
padding:12px;
border-radius:25px;
border:none;
outline:none;
font-size:16px;
}

.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 10px 25px rgba(0,0,0,0.3);
transition:0.3s;
color:black;
}

.card:hover{
transform:scale(1.05);
}

.card img{
width:100%;
display:block;
}

.card-title{
padding:10px;
font-weight:bold;
text-align:center;
}

</style>

</head>

<body>

<div class="header">
<img src="logo.jpg" class="logo">
<h1>Shelby Media Gallery</h1>
<p>Fast media delivery powered by Shelby (concept demo)</p>
</div>

<div class="search-box">
<input type="text" id="searchInput" placeholder="Search images...">
</div>

<!-- Gallery trống -->
<div class="gallery" id="gallery">

<!-- Mày sẽ add ảnh vào đây -->

</div>

<script>

const searchInput = document.getElementById("searchInput");

searchInput.addEventListener("keyup", function(){
let value = this.value.toLowerCase();
let cards = document.querySelectorAll(".card");

cards.forEach(card => {
let title = card.innerText.toLowerCase();

if(title.includes(value)){
card.style.display = "block";
}else{
card.style.display = "none";
}
});
});

</script>

</body>
</html>
